[project]
name = "termite-circus"
version = "0.1.0"
description = "Standalone paired inference benchmarks for a supplied Antfly binary"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gliner2[local]==2.1.0",
  "huggingface-hub==1.31.0",
  "pillow==13.0.0",
  "psutil==7.2.2",
  "pyarrow==26.0.1",
  "sentence-transformers==6.2.0",
  "soundfile==0.14.0",
  "torch==2.15.0",
  "torchvision==0.29.2",
  "transformers==5.22.2",
]

[project.optional-dependencies]
cuda = [
  "cuda-toolkit[cublas,nvcc]==13.2.2; sys_platform == 'linux'",
  "nvidia-ml-py==13.615.71; sys_platform == 'linux'",
]

[tool.uv]
package = false
